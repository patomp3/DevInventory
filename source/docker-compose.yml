# เฟส 1 — ตาม design.md §15.1
# ใช้: cp .env.example .env แล้วแก้ค่า จากนั้น docker compose up -d --build
services:
  # รัน migration + สร้าง Super Admin คนแรก (ข้ามถ้ามีผู้ใช้แล้ว) แล้วจบ
  migrate:
    build: { context: ., target: build }
    command: sh -c "npm run db:migrate && npm run db:seed"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      # แอปใช้ role สิทธิ์ต่ำ (APP_DATABASE_URL) ถ้าตั้งไว้ — ไม่งั้นใช้ DATABASE_URL เดิม (ดู docs/runbook.md §0)
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL}}
    volumes:
      - files:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # ICU th-TH เพื่อให้ pg_trgm นับอักษรไทยเป็นตัวอักษร (design.md §8.8)
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=th-TH --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - app
    restart: unless-stopped

  # งานลบถาวรรายการในถังขยะที่เกิน 30 วัน (design.md §10.3) วันละครั้งนับจากเวลาที่ container เริ่ม
  purge:
    build: { context: ., target: build }
    command: sh -c "while true; do npm run job:purge; sleep 86400; done"
    env_file: .env
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-${DATABASE_URL}}
    volumes:
      - files:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # backup (pg_dump + restic): ดู scripts/backup.sh และ docs/runbook.md

volumes:
  files:
  pgdata:
  caddy:
